name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PAM headers and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python sources
        run: python -m py_compile app.py config.py subsystems/ai/services.py subsystems/exams/services.py
      - name: Validate browser JavaScript
        run: node --check static/app.js
