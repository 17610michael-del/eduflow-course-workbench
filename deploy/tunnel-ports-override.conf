# systemd drop-in：在现有杭州网关隧道上追加 8081/8082 两个端口的反向转发。
# 安装位置：/etc/systemd/system/eduflow-hangzhou-tunnel.service.d/override.conf
[Service]
ExecStart=
ExecStart=/usr/bin/ssh -NT -i /home/kltst/.ssh/id_ed25519_eduflow_hz -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/kltst/.ssh/known_hosts_eduflow_hz -R 127.0.0.1:18080:127.0.0.1:80 -R 127.0.0.1:18081:127.0.0.1:8081 -R 127.0.0.1:18082:127.0.0.1:8082 -R 127.0.0.1:32001:127.0.0.1:32001 -R 127.0.0.1:32010:127.0.0.1:32010 -R 127.0.0.1:38080:10.98.103.199:8080 eduflow-tunnel@47.96.100.122
