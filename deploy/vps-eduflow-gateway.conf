# EduFlow 三课程外网入口（先 HTTP 验证连通，再用 certbot 自动加 HTTPS）
# 安装位置（VPS）：/etc/nginx/sites-available/eduflow-gateway
# 随后：sudo ln -sfn 到 sites-enabled，nginx -t && reload，最后 certbot --nginx。

map $http_host $eduflow_upstream {
    default                    127.0.0.1:18080;
    eduflow.47.96.100.122.nip.io 127.0.0.1:18080;
    bio-g.47.96.100.122.nip.io   127.0.0.1:18081;
    bio-u.47.96.100.122.nip.io   127.0.0.1:18082;
}

server {
    listen 80;
    listen [::]:80;
    server_name eduflow.47.96.100.122.nip.io bio-g.47.96.100.122.nip.io bio-u.47.96.100.122.nip.io;

    client_max_body_size 20m;

    location / {
        proxy_pass http://$eduflow_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
